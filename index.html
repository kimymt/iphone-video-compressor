      Locale 切替時の document.title は I18nProvider が JS で書き換える。

    <meta
      name="description"
      content="iPhone の動画を iOS 26+ Safari でローカル圧縮するサーバーレス PWA。動画はデバイスから外に出ません。"

    <meta property="og:url" content="https://ivc.mymt.casa" />
    <meta property="og:title" content="動画圧縮 — iOS 26+ 専用" />

      property="og:description"
      content="iPhone の動画を iOS 26+ Safari でローカル圧縮するサーバーレス PWA。動画はデバイスから外に出ません。"
    />
    <meta property="og:image" content="https://ivc.mymt.casa/icons/icon-512.png" />

      name="twitter:description"
      content="iPhone の動画を iOS 26+ Safari でローカル圧縮するサーバーレス PWA。"
    />
