<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>transcode spike (Phase 3b core)</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --surface: #1c1c1e;
        --label: #ffffff;
        --label-secondary: rgba(235, 235, 245, 0.6);
        --label-tertiary: rgba(235, 235, 245, 0.3);
        --accent: #0a84ff;
        --success: #30d158;
        --error: #ff3b30;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        background: var(--bg);
        color: var(--label);
        margin: 0;
        padding: 16px;
        padding-top: max(env(safe-area-inset-top), 16px);
        padding-bottom: max(env(safe-area-inset-bottom), 16px);
        max-width: 720px;
        margin-left: auto;
        margin-right: auto;
        line-height: 1.5;
      }
      h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
      p.lead { color: var(--label-secondary); margin: 0 0 1rem; font-size: 0.875rem; }
      label.row {
        display: block;
        margin: 12px 0;
        font-size: 0.875rem;
        color: var(--label-secondary);
      }
      input[type="file"], select, button {
        width: 100%;
        margin-top: 4px;
        padding: 12px;
        background: var(--surface);
        color: var(--label);
        border: 1px solid rgba(84, 84, 88, 0.5);
        border-radius: 10px;
        font-size: 1rem;
      }
      button {
        background: var(--accent);
        border: none;
        font-weight: 600;
        min-height: 44px;
      }
      button:disabled { background: var(--surface); color: var(--label-tertiary); }
      button.cancel { background: var(--error); margin-top: 8px; }
      progress {
        width: 100%;
        height: 6px;
        margin: 12px 0;
      }
      pre#log {
        background: var(--surface);
        padding: 12px;
        border-radius: 10px;
        font-size: 0.75rem;
        line-height: 1.5;
        max-height: 360px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        margin: 12px 0;
        color: var(--label-secondary);
      }
      pre#log .ok { color: var(--success); }
      pre#log .err { color: var(--error); }
      pre#log .label { color: var(--label); font-weight: 600; }
      video {
        width: 100%;
        max-height: 50vh;
        border-radius: 12px;
        background: #000;
        display: none;
        margin: 12px 0;
      }
      a#download {
        display: none;
        padding: 14px;
        background: var(--success);
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>transcode spike</h1>
    <p class="lead">Phase 3b core (mux + transcode) 動作確認用。ファイル選択 → プリセット選択 → Run。Worker 外で直接呼ぶ。</p>

    <label class="row">
      動画ファイル
      <input type="file" id="file" accept="video/*,.mov,.mp4,.m4v" />
    </label>

    <label class="row">
      プリセット
      <select id="preset"></select>
    </label>

    <label class="row" style="display:flex;align-items:center;gap:8px;">
      <input type="checkbox" id="useWorker" style="width:auto;flex:0 0 auto;" />
      Worker 経由で実行 (チェック無しはメインスレッド直呼び)
    </label>

    <button id="run">Run transcode</button>
    <button id="cancel" class="cancel" style="display:none">Cancel</button>

    <progress id="progress" value="0" max="100"></progress>

    <video id="preview" controls playsinline></video>
    <a id="download" download="spike-transcoded.mp4">Download</a>
    <pre id="log"></pre>

    <script type="module" src="./transcode-check.ts"></script>
  </body>
</html>
